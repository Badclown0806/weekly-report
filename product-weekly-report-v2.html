<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<title>周报 V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a;padding:16px;max-width:1400px;margin:0 auto}
h2{font-size:16px;font-weight:700;color:#1e293b;margin:16px 0 10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
h2:hover{color:#3b82f6}
h2 .arrow{font-size:12px;transition:.2s}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.collapsed > :not(h2){display:none}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header .title{font-size:18px;font-weight:800}
.version{font-size:10px;color:#94a3b8}

/* Presets */
.presets{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.preset-btn{padding:4px 14px;border-radius:16px;font-size:11px;cursor:pointer;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;transition:.15s}
.preset-btn:hover{background:#e2e8f0}
.preset-btn.on{background:#3b82f6;color:#fff;border-color:#2563eb}

/* Week tags */
.week-tags-wrap{margin:6px 0}
.week-tags{display:flex;flex-wrap:wrap;gap:4px;max-height:300px;overflow-y:auto}
.week-tag{padding:3px 8px;border-radius:12px;font-size:10px;cursor:pointer;background:#e2e8f0;color:#475569;border:1px solid transparent;white-space:nowrap;transition:.1s}
.week-tag:hover{opacity:.8}
.week-tag.on{background:#3b82f6;color:#fff}
.ym-label{font-size:10px;font-weight:700;color:#64748b;width:100%;margin:2px 0;padding-left:4px}

/* Tags */
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.tag-row .label{font-size:12px;font-weight:600;color:#475569;white-space:nowrap}
.tag{padding:3px 10px;border-radius:12px;font-size:11px;cursor:pointer;background:#e2e8f0;color:#475569;border:1px solid transparent;transition:.1s}
.tag:hover{opacity:.8}
.tag.on.owner{background:#8b5cf6;color:#fff}
.tag.on.shop{background:#f59e0b;color:#fff}

/* Target Board */
.month-sel{margin-bottom:10px;font-size:12px;color:#475569}
.month-sel select{padding:2px 8px;border-radius:4px;border:1px solid #cbd5e1;font-size:12px;margin-left:6px}
.tgt-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tgt-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:11px 13px}
.tgt-item .tl{font-size:11px;font-weight:600;color:#64748b;margin-bottom:3px}
.tgt-item .tv{font-size:17px;font-weight:700;color:#1e40af}
.tgt-item .tt{font-size:9px;color:#94a3b8;margin:2px 0}
.tgt-item .tp{font-size:10px;font-weight:600;margin-top:3px}
.tp.ok{color:#16a34a}.tp.warn{color:#d97706}.tp.low{color:#dc2626}.tp.na{color:#94a3b8}
.tgt-bar{height:4px;background:#e2e8f0;border-radius:2px;margin-top:4px;overflow:hidden}
.tgt-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.tbf-ok{background:#10b981}.tbf-warn{background:#f59e0b}.tbf-low{background:#ef4444}

/* Charts */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px}

/* Tables */
.tbl-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:10px}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid #e2e8f0;white-space:nowrap}
th{background:#f1f5f9;font-weight:600;color:#475569;position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2}
th:first-child{background:#f1f5f9;z-index:3}
tr:hover td{background:#f8fafc}
tr:hover td:first-child{background:#f8fafc}

.loading{text-align:center;padding:30px;color:#94a3b8;font-size:13px}
.err{color:#dc2626;padding:10px;background:#fef2f2;border-radius:6px;font-size:12px;display:none;margin:8px 0}
.empty{text-align:center;padding:20px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>

<div class="card" style="padding-bottom:8px">
  <div class="header">
    <span class="title">周报 V2</span>
    <span class="version" id="buildVer"></span>
  </div>
  <div class="presets" id="presets"></div>
  <div class="week-tags-wrap" id="weekTagsWrap" style="display:none">
    <div class="week-tags" id="weekTags"></div>
  </div>
  <div class="tag-row" id="ownerRow"></div>
  <div class="tag-row" id="shopRow"></div>
</div>

<div class="card" id="targetCard">
  <h2 onclick="toggleCard('targetCard')">月度目标完成情况 <span class="arrow">▼</span></h2>
  <div class="month-sel" id="monthSel"></div>
  <div class="tgt-board" id="tgtGrid"><div class="loading">选择月份查看</div></div>
</div>

<div class="card collapsed" id="chartCard">
  <h2 onclick="toggleCard('chartCard')">趋势图 <span class="arrow">▼</span></h2>
  <div class="charts-grid" id="chartsGrid"></div>
</div>

<div class="card collapsed" id="shopCard">
  <h2 onclick="toggleCard('shopCard')">店铺汇总 <span class="arrow">▼</span></h2>
  <div class="tbl-wrap" id="shopGrid"></div>
</div>

<div class="card collapsed" id="prodCard">
  <h2 onclick="toggleCard('prodCard')">产品维度 <span class="arrow">▼</span></h2>
  <div class="tbl-wrap" id="prodTable"></div>
</div>

<div class="loading" id="loading">正在加载数据...</div>
<div class="err" id="error"></div>

<script src="data_v2.js"></script>
<script>
function toggleCard(id){document.getElementById(id).classList.toggle('collapsed')}
var D,WEEKS,WEEKS_ISO,WEEK_LABELS,WEEK_RANGES,WEEK_YEARS,WEEK_MONTHS,WEEK_YEAR_MONTHS;
var SHOP_WEEKLY,WEEK_DATA,PERSON_TARGETS,MONTHLY_COMPLETION,SKU_IMG,SKU_OWNER;
var ALL_ENTITIES=[],selEntities=new Set(),selWeeks=new Set(),preset='this';

(function init(){
  if(typeof DATA_V2==='undefined'){document.getElementById('loading').textContent='数据加载失败';return}
  D=DATA_V2;
  WEEKS=D.WEEKS;WEEKS_ISO=D.WEEKS_ISO;WEEK_LABELS=D.WEEK_LABELS;WEEK_RANGES=D.WEEK_RANGES;
  WEEK_YEARS=D.WEEK_YEARS;WEEK_MONTHS=D.WEEK_MONTHS;WEEK_YEAR_MONTHS=D.WEEK_YEAR_MONTHS;
  SHOP_WEEKLY=D.SHOP_WEEKLY||{};WEEK_DATA=D.WEEK_DATA||{};
  PERSON_TARGETS=D.PERSON_TARGETS||{};MONTHLY_COMPLETION=D.MONTHLY_COMPLETION||{};
  SKU_IMG=D.SKU_IMG||{};SKU_OWNER=D.SKU_OWNER||{};

  ALL_ENTITIES=Object.keys(PERSON_TARGETS).length>0?Object.keys(PERSON_TARGETS):Object.keys(SHOP_WEEKLY);
  selEntities=new Set(ALL_ENTITIES);
  document.getElementById('buildVer').textContent=D._VERSION||'';
  selWeeks=new Set([WEEKS[WEEKS.length-1]]);

  document.getElementById('loading').style.display='none';
  renderPresets();renderEntityTags();renderTargetBoard();refreshAll();
  document.getElementById('targetCard').classList.remove('collapsed');
})();

function renderPresets(){
  var presets=[{l:'本周',m:'this'},{l:'近4周',m:'4w'},{l:'本月',m:'month'},{l:'全部',m:'all'},{l:'自定义',m:'custom'}];
  var h='';presets.forEach(function(p){
    h+='<span class="preset-btn'+(preset===p.m?' on':'')+'" onclick="onPreset(\''+p.m+'\')">'+p.l+'</span>';
  });
  document.getElementById('presets').innerHTML=h;
  var wrap=document.getElementById('weekTagsWrap');
  if(preset==='custom'){
    wrap.style.display='block';renderWeekTags();
  }else{wrap.style.display='none'}
}

function onPreset(m){
  preset=m;var n=WEEKS.length;
  if(m==='this') selWeeks=new Set([WEEKS[n-1]]);
  else if(m==='4w') selWeeks=new Set(WEEKS.slice(Math.max(0,n-4)));
  else if(m==='month'){
    var lm=WEEK_MONTHS[n-1],ly=WEEK_YEARS[n-1];selWeeks=new Set();
    WEEKS.forEach(function(w,i){if(WEEK_YEARS[i]===ly&&WEEK_MONTHS[i]===lm)selWeeks.add(w)});
  }else if(m==='all') selWeeks=new Set(WEEKS);
  renderPresets();refreshAll();
}

function renderWeekTags(){
  var c=document.getElementById('weekTags'),h='',lym='';
  WEEKS.forEach(function(w,i){
    var ym=WEEK_YEAR_MONTHS[i]||'';
    if(ym!==lym){h+='<span class="ym-label">'+ym+'</span>';lym=ym}
    h+='<span class="week-tag'+(selWeeks.has(w)?' on':'')+'" onclick="tw(\''+w+'\')">'+(WEEK_LABELS[i]||w).substring(0,20)+'</span>';
  });c.innerHTML=h;
}
function tw(w){selWeeks.has(w)?selWeeks.delete(w):selWeeks.add(w);if(selWeeks.size===0)selWeeks.add(w);preset='custom';renderPresets();refreshAll()}

function renderEntityTags(){
  var or=document.getElementById('ownerRow'),sr=document.getElementById('shopRow');
  var entities=ALL_ENTITIES,label='筛选:';
  if(PERSON_TARGETS&&Object.keys(PERSON_TARGETS).length>0&&!PERSON_TARGETS[Object.keys(PERSON_TARGETS)[0]].hasOwnProperty('profit_target')){
    label='店铺:';
  }
  var h='<span class="label">'+label+'</span>';
  entities.forEach(function(e){
    h+='<span class="tag '+(selEntities.has(e)?'on owner':'owner')+'" onclick="te(\''+e.replace(/'/g,"\\'")+'\')">'+e+'</span>';
  });
  or.innerHTML=h;

  var shops=Object.keys(SHOP_WEEKLY).sort();
  var sh='<span class="label">店铺:</span>';
  shops.forEach(function(s){
    sh+='<span class="tag '+(selEntities.has(s)?'on shop':'shop')+'" onclick="ts(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</span>';
  });
  sr.innerHTML=sh;
}
function te(e){selEntities.has(e)?selEntities.delete(e):selEntities.add(e);renderEntityTags();renderTargetBoard();refreshAll()}
function ts(s){selEntities.has(s)?selEntities.delete(s):selEntities.add(s);renderEntityTags();refreshAll()}

// ===== Target Board =====
function renderTargetBoard(){
  var entity=ALL_ENTITIES[0];
  for(var e of selEntities){entity=e;break}
  var mc=MONTHLY_COMPLETION[entity];
  if(!mc){document.getElementById('tgtGrid').innerHTML='<div class="empty">暂无目标数据</div>';return}
  var months=Object.keys(mc).sort(function(a,b){return parseInt(a)-parseInt(b)});
  var cm=months[months.length-1];
  var sel='<select onchange="changeMonth(this.value)">';
  months.forEach(function(m){sel+='<option value="'+m+'"'+(m===cm?' selected':'')+'>'+m+'月</option>'});
  sel+='</select>';
  document.getElementById('monthSel').innerHTML='负责人: <b>'+entity+'</b> | 月份:'+sel;
  renderMonth(entity,cm);
}

function changeMonth(m){
  var entity=ALL_ENTITIES[0];
  for(var e of selEntities){entity=e;break}
  renderMonth(entity,m);
}

function renderMonth(entity,month){
  var g=document.getElementById('tgtGrid');
  var d=MONTHLY_COMPLETION[entity]||{},md=d[month];
  if(!md){g.innerHTML='<div class="empty">暂无该月数据</div>';return}
  var tp=md.time_progress||0,a=md.actual,t=md.target,dr=md.derived,cp=md.completion;

  function fmtMoney(v){if(typeof v!=='number')return '-';var abs=Math.abs(v);return (v<0?'-':'')+(abs/10000).toFixed(1)+'万'}
  function fmtInt(v){return typeof v==='number'?Math.round(v):'-'}
  function fmtPct(v){return typeof v==='number'?v.toFixed(1)+'%':'-'}
  function progCls(v){if(v==='-')return'na';return v>=100?'ok':(v>=70?'warn':'low')}

  var items=[
    {l:'利润',av:fmtMoney(a.profit),tv:fmtMoney(t.profit_target),pct:t.profit_target>0?Math.min(100,a.profit/t.profit_target*100):0,pr:cp.profit_progress,prc:progCls(cp.profit_progress)},
    {l:'GSV',av:fmtMoney(a.gsv),tv:fmtMoney(t.gsv_target),pct:t.gsv_target>0?Math.min(100,a.gsv/t.gsv_target*100):0,pr:cp.gsv_progress,prc:progCls(cp.gsv_progress)},
    {l:'GMV',av:fmtMoney(a.gmv),tv:fmtMoney(t.gmv_target),pct:t.gmv_target>0?Math.min(100,a.gmv/t.gmv_target*100):0,pr:cp.gmv_progress,prc:progCls(cp.gmv_progress)},
    {l:'销量',av:fmtInt(a.qty),tv:fmtInt(t.sales_target),pct:t.sales_target>0?Math.min(100,a.qty/t.sales_target*100):0,pr:cp.sales_progress,prc:progCls(cp.sales_progress)},
    {l:'实销',av:fmtMoney(a.real_sales),tv:fmtMoney(t.real_sales_target),pct:t.real_sales_target>0?Math.min(100,a.real_sales/t.real_sales_target*100):0,pr:cp.real_sales_progress,prc:progCls(cp.real_sales_progress)},
    {l:'利润率',av:fmtPct(dr.margin_pct),tv:t.margin_target+'%',pct:typeof dr.margin_pct==='number'?Math.min(100,dr.margin_pct/t.margin_target*100):0,pr:'-',prc:'na'},
    {l:'退款率',av:fmtPct(dr.return_rate),tv:t.return_target+'%',pct:typeof dr.return_rate==='number'?Math.min(100,dr.return_rate/t.return_target*100):0,pr:'-',prc:'na'},
    {l:'时间进度',av:fmtPct(tp),tv:'100%',pct:tp,pr:'-',prc:'na'},
  ];

  var h='';
  items.forEach(function(it){
    var bc=it.pct>=100?'tbf-ok':(it.pct>=70?'tbf-warn':'tbf-low');
    var prStr=it.pr==='-'?'':'完成进度 '+it.pr+(typeof it.pr==='number'?'%':'');
    h+='<div class="tgt-item">';
    h+='<div class="tl">'+it.l+'</div>';
    h+='<div class="tv">'+it.av+'</div>';
    h+='<div class="tt">目标 '+it.tv+'</div>';
    h+='<div class="tgt-bar"><div class="tgt-bar-fill '+bc+'" style="width:'+Math.abs(it.pct)+'%"></div></div>';
    h+='<div class="tp '+it.prc+'">'+prStr+'</div>';
    h+='</div>';
  });
  g.innerHTML=h;
}

// ===== Charts =====
function renderCharts(){
  var container=document.getElementById('chartsGrid');
  var weeks=Array.from(selWeeks).sort();
  if(weeks.length<2){container.innerHTML='<div class="empty">请选择至少2周查看趋势</div>';return}

  var labels=[],profitData=[],gsvData=[],marginData=[],salesData=[];
  weeks.forEach(function(w){
    var idx=WEEKS.indexOf(w);
    labels.push(idx>=0?WEEK_LABELS[idx].substring(0,16):w);
    var totalP=0,totalG=0,totalQ=0;
    if(WEEK_DATA[w]&&WEEK_DATA[w].shops){
      for(var s in WEEK_DATA[w].shops){
        if(selEntities.has(s)){totalP+=WEEK_DATA[w].shops[s].profit||0;totalG+=WEEK_DATA[w].shops[s].gsv||0;}
      }
    }
    profitData.push(totalP/10000);gsvData.push(totalG/10000);
    marginData.push(totalG>0?totalP/totalG*100:0);
    var sw=(SHOP_WEEKLY||{});
    weeks.forEach(function(w2){if(sw[w2]){for(var s2 in sw[w2]){if(selEntities.has(s2))totalQ+=sw[w2][s2].qty||0}}});
    salesData.push(totalQ);
  });

  var charts=[
    {id:'profitChart',title:'利润趋势(万)',data:profitData,color:'#3b82f6'},
    {id:'gsvChart',title:'GSV趋势(万)',data:gsvData,color:'#10b981'},
    {id:'marginChart',title:'利润率趋势(%)',data:marginData,color:'#8b5cf6'},
  ];

  var h='';
  charts.forEach(function(ch){h+='<canvas id="'+ch.id+'" width="360" height="200"></canvas>'});
  container.innerHTML=h;

  charts.forEach(function(ch){drawLine(ch.id,labels,ch.data,ch.color)});
}

function drawLine(cid,labels,data,color){
  var c=document.getElementById(cid);if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  if(data.length===0)return;
  var p={t:22,r:16,b:35,l:50},cw=W-p.l-p.r,ch=H-p.t-p.b;
  var max=Math.max.apply(null,data.map(Math.abs))*1.15||1;
  var min=Math.min.apply(null,data);if(min<0)max=Math.max(max,Math.abs(min)*1.15);

  // Grid
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=.5;
  for(var i=0;i<=4;i++){
    var y=p.t+ch*(1-i/4);
    ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='9px sans-serif';ctx.textAlign='right';
    ctx.fillText((max*i/4).toFixed(0),p.l-4,y+3);
  }

  // Line
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  data.forEach(function(v,i){
    var x=p.l+(i/Math.max(1,data.length-1))*cw;
    var y=p.t+ch*(1-(v+max*0)/max);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    // Dot
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.stroke();

  // Labels
  ctx.fillStyle='#64748b';ctx.font='8px sans-serif';
  labels.forEach(function(l,i){
    var x=p.l+(i/Math.max(1,labels.length-1))*cw;
    ctx.save();ctx.translate(x,H-p.b+6);ctx.rotate(-.4);
    ctx.fillText(l,0,0);ctx.restore();
  });
}

// ===== Shop Summary =====
function renderShopGrid(){
  var container=document.getElementById('shopGrid');
  var weeks=Array.from(selWeeks).sort();
  if(weeks.length===0){container.innerHTML='<div class="empty">请选择周</div>';return}
  var shops=Object.keys(SHOP_WEEKLY).filter(function(s){return selEntities.has(s)}).sort();
  var h='<table><thead><tr><th>店铺</th>';
  weeks.forEach(function(w){var i=WEEKS.indexOf(w);h+='<th>'+(i>=0?WEEK_LABELS[i].substring(0,10):w)+'</th>'});
  h+='</tr></thead><tbody>';
  shops.forEach(function(shop){
    h+='<tr><td>'+shop+'</td>';
    weeks.forEach(function(w){
      var d=(SHOP_WEEKLY[shop]||{})[w];
      if(d) h+='<td>GSV:'+d.gsv.toFixed(0)+'<br><span style="font-size:9px;color:#94a3b8">利:'+d.profit.toFixed(0)+'</span></td>';
      else h+='<td>-</td>';
    });h+='</tr>';
  });h+='</tbody></table>';container.innerHTML=h;
}

// ===== Product Table =====
function renderProdTable(){
  var container=document.getElementById('prodTable');
  var weeks=Array.from(selWeeks).sort();
  if(weeks.length===0){container.innerHTML='<div class="empty">请选择周</div>';return}
  var merged={};
  weeks.forEach(function(w){
    var wd=WEEK_DATA[w];if(!wd||!wd.allProducts)return;
    wd.allProducts.forEach(function(p){
      if(!selEntities.has(p.shop))return;
      var k=p.sku+'|'+p.shop;
      if(!merged[k])merged[k]={sku:p.sku,shop:p.shop,gsv:0,profit:0,qty:0,real_sales:0};
      merged[k].gsv+=p.gsv||0;merged[k].profit+=p.profit||0;
      merged[k].qty+=p.qty||0;merged[k].real_sales+=p.real_sales||0;
    });
  });
  var prods=[];
  for(var k in merged){var m=merged[k];m.margin=m.gsv>0?m.profit/m.gsv*100:0;prods.push(m)}
  prods.sort(function(a,b){return b.gsv-a.gsv});
  var h='<table><thead><tr><th>图片</th><th>SKU</th><th>店铺</th><th>GSV</th><th>利润</th><th>利润率</th><th>销量</th><th>实销</th></tr></thead><tbody>';
  if(prods.length===0)h+='<tr><td colspan="8" class="empty">暂无产品数据</td></tr>';
  else prods.forEach(function(p){
    var img=SKU_IMG[p.sku]||'';
    h+='<tr>';
    h+='<td>'+(img?'<img src="'+img+'" style="width:36px;height:36px;object-fit:cover;border-radius:4px">':'')+'</td>';
    h+='<td>'+p.sku+'</td><td>'+p.shop+'</td>';
    h+='<td>'+p.gsv.toFixed(0)+'</td><td>'+p.profit.toFixed(0)+'</td>';
    h+='<td>'+(p.margin||0).toFixed(2)+'%</td>';
    h+='<td>'+p.qty+'</td><td>'+p.real_sales.toFixed(0)+'</td></tr>';
  });h+='</tbody></table>';container.innerHTML=h;
}

function refreshAll(){renderCharts();renderShopGrid();renderProdTable()}
</script>
</body>
</html>
